version: '3.8'

services:
  # 1. Frontend: Vite + React SPA (Nginx)
  frontend:
    image: nginx:alpine
    container_name: saraban_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx.enterprise.conf:/etc/nginx/conf.d/default.conf
      - ./uploads:/var/www/uploads
    depends_on:
      - php-api
    restart: unless-stopped

  # 2. Backend: PHP 8.2-FPM Enterprise REST API
  php-api:
    image: php:8.2-fpm-alpine
    container_name: saraban_php_api
    working_dir: /var/www/html
    volumes:
      - ./php-api:/var/www/html
      - ./uploads:/var/www/uploads
    environment:
      - DB_DRIVER=pgsql
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_DATABASE=saraban_enterprise
      - DB_USERNAME=postgres
      - DB_PASSWORD=saraban_secure_password_2569
      - JWT_SECRET=saraban-enterprise-secure-jwt-secret-key-2569
    depends_on:
      - postgres-db
    restart: unless-stopped

  # 3. Database: PostgreSQL 16
  postgres-db:
    image: postgres:16-alpine
    container_name: saraban_postgres
    environment:
      POSTGRES_DB: saraban_enterprise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: saraban_secure_password_2569
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database_postgresql.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  pgdata:
